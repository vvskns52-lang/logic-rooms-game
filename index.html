<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120707">
  <meta name="description" content="함께 푸는 실시간 두뇌게임">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./classroom.css?v=finale-11">
  <link rel="stylesheet" href="./horror.css?v=finale-11">
  <title>생각의 문</title>
</head>
<body>
  <header class="header">
    <a class="brand" id="home-link" href="./"><span class="brand-mark" aria-hidden="true"></span>생각의 문</a>
    <div class="header-actions">
      <button id="bgm-button" class="button quiet bgm-toggle" type="button" aria-pressed="false" hidden><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="bgm-label">배경음</span></button>
      <button id="guide-button" class="button quiet" type="button" aria-haspopup="dialog" hidden>정답·풀이</button>
      <span id="room-badge" class="room-badge" hidden></span>
    </div>
  </header>

  <main class="wrap">
    <section class="entry" id="entry">
      <div class="entry-copy">
        <p class="section-label" id="entry-label">실시간 두뇌게임</p>
        <h1>생각의 문</h1>
        <p class="entry-description" id="entry-description">순간암기, 수 감각, 도형 해석, 논리 추리.<br>한 문제씩 펼쳐지는 두뇌게임이에요.</p>
      </div>
      <form class="entry-panel" id="join-form">
        <h2>학생 입장</h2>
        <label>입장 코드<input id="join-code" maxlength="6" minlength="5" required autocapitalize="characters" spellcheck="false" autocomplete="off" placeholder="입장 코드"></label>
        <label>별명<input id="join-name" maxlength="14" required autocomplete="off" placeholder="게임에서 쓸 별명"></label>
        <button class="button primary" type="submit">방에 입장하기</button>
        <a class="small-link" href="./?host=1">선생님 화면</a>
      </form>
      <form class="entry-panel" id="host-form" hidden>
        <h2>선생님 입장</h2>
        <label>게임 방식<select id="game-mode"><option value="solo">개인전 · 생각의 문</option><option value="team">모둠전 · 방탈출과 결승</option></select></label>
        <p id="mode-help"></p>
        <label><span id="key-label">선생님 입장 키</span><input id="teacher-key" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="숫자 4자리" required autocomplete="off" spellcheck="false"></label>
        <button class="button primary" type="submit">개인전 방 만들기</button>
        <a class="small-link" href="./">학생 입장 화면</a>
        <a class="small-link" id="classroom-download" hidden href="https://github.com/vvskns52-lang/logic-rooms-game#모둠전-준비">모둠 탈출전·결승 수업 준비</a>
      </form>
      <p id="entry-error" class="entry-error" role="alert" hidden></p>
    </section>

    <section id="live" class="live" hidden>
      <p id="live-alert" role="status" class="live-alert" hidden></p>
      <section id="scene" class="scene" aria-labelledby="scene-title"></section>
    </section>
  </main>

  <dialog id="guide" class="guide" aria-labelledby="guide-title">
    <div class="guide-top">
      <h2 id="guide-title">정답과 풀이</h2>
      <form method="dialog"><button class="button quiet" type="submit" autofocus>닫기</button></form>
    </div>
    <p id="guide-status" role="status"></p>
    <div id="guide-content" hidden>
      <label for="guide-question">문제 선택</label>
      <select id="guide-question"></select>
      <h3 id="guide-answer"></h3>
      <p id="guide-explanation"></p>
    </div>
  </dialog>
  <script type="module" src="./classroom.js?v=mode-choice-2"></script>
  <script type="module" src="./bgm.js?v=finale-11"></script>
</body>
</html>
