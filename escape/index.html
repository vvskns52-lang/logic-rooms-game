<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마지막 주파수 · 모둠 탈출전</title><link rel="stylesheet" href="./style.css">
<style>
#entry{max-width:480px;margin:25px auto;padding:25px}label{display:block;margin:12px 0;color:var(--dim)}input,select{display:block;width:100%;padding:11px;margin-top:4px;background:#102027;color:var(--ink);border:1px solid #53696e;border-radius:6px;font:inherit}.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.btns .primary{width:auto;margin:0}.tag{padding:4px 8px;border:1px solid var(--line);border-radius:6px}.list{display:grid;gap:6px;padding:0;list-style:none}.list li{background:#22353c;border-radius:7px;padding:8px}.mapwrap{height:clamp(290px,34vw,480px)}.private{font-size:.9rem}.selected-reel{outline:2px solid var(--gold)}.card select{max-width:250px}.strip{font-size:.86rem;margin:8px 0;color:var(--mint)}#note{min-height:1.6em;color:var(--gold);position:sticky;bottom:0;background:#13242b;padding:4px 10px;z-index:3}button{touch-action:manipulation}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}#field p{margin:6px 0}.winner{color:var(--gold)}.hero{padding-bottom:12px}
</style></head><body>
<header><div><div class="brand">◉　방송부 사건실</div><span class="tag" id="badge">모둠 탈출전</span></div></header>
<main><section class="hero"><div><p class="eyebrow">축제 방송 복구 작전</p><h1>마지막 주파수</h1><p id="subtitle">같은 방송동에 모여 단서를 찾고, 결승에서 가장 먼저 탈출하세요.</p></div></section>
<section class="panel" id="entry"><h2>모둠전 입장</h2><p>교실 첫 화면에서 모둠전 코드와 별명을 입력하세요.</p><a id="returnLink" href="/" style="color:var(--gold)">생각의 문으로 돌아가기</a></section>
<div id="game" hidden><div class="layout"><section class="panel"><div class="mapwrap"><canvas id="map" aria-label="네 방이 연결된 학교 방송동"></canvas><span class="maptag" id="maptag"></span></div><div class="mapfoot"><span>방을 누르면 캐릭터가 조사 지점까지 이동합니다.</span><b id="clock"></b></div></section><aside><section class="panel card" id="field"></section><section class="panel card" id="team"></section></aside></div><section class="board"><div class="row"><h2>모둠 단서판</h2><span id="summary" class="counter"></span></div><div class="cards" id="board"></div></section><section class="panel card"><h2>모둠 현황</h2><ul class="list" id="scores"></ul></section></div>
<div role="status" id="note"></div></main>
<script src="./scene.js" defer></script><script src="./play.js" defer></script></body></html>
